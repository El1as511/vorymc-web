<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoryMC - Login Staff</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body class="bg-black text-neutral-200 min-h-screen flex items-center justify-center font-['Inter'] px-4 selection:bg-white selection:text-black">

    <div class="max-w-md w-full bg-neutral-950 border border-neutral-800 p-8 rounded-2xl shadow-2xl">
        
        <!-- Logo Header -->
        <div class="text-center mb-8">
            <a href="/" class="inline-block mb-4">
                <img src="{{ url_for('static', filename='img/vorylogosinip.png') }}" alt="VoryMC Logo" class="h-12 mx-auto object-contain">
            </a>
            <h1 class="text-2xl font-bold text-white font-['Fredoka']">Acceso de Staff</h1>
            <p class="text-xs text-neutral-500 mt-1">Portal privado para el equipo de VoryMC</p>
        </div>

        <!-- Alerta de Error -->
        {% if error %}
        <div class="bg-neutral-900 border border-neutral-700 text-white text-xs p-3 rounded-lg mb-6 flex items-center space-x-2">
            <i class="fa-solid fa-circle-exclamation text-neutral-400"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- Formulario -->
        <form action="/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-neutral-400 uppercase tracking-wider mb-2">Usuario / Nickname</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-neutral-500">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" name="username" required placeholder="Tu usuario de Minecraft"
                           class="w-full bg-neutral-900 border border-neutral-800 rounded-lg py-2.5 pl-10 pr-4 text-sm text-white placeholder-neutral-600 focus:outline-none focus:border-neutral-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-neutral-400 uppercase tracking-wider mb-2">Contraseña</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-neutral-500">
                        <i class="fa-solid fa-key"></i>
                    </span>
                    <input type="password" name="password" required placeholder="••••••••••••"
                           class="w-full bg-neutral-900 border border-neutral-800 rounded-lg py-2.5 pl-10 pr-4 text-sm text-white placeholder-neutral-600 focus:outline-none focus:border-neutral-500 transition">
                </div>
            </div>

            <button type="submit" 
                    class="w-full bg-white hover:bg-neutral-200 text-black font-bold py-3 rounded-lg text-sm transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>Ingresar al Portal</span>
            </button>
        </form>

        <div class="mt-8 text-center border-t border-neutral-900 pt-4">
            <a href="/" class="text-xs text-neutral-500 hover:text-white transition">← Volver al sitio web principal</a>
        </div>
    </div>

</body>
</html>
